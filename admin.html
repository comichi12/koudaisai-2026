<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>進行管理 | Grazie!! 工大祭2026</title><link rel="stylesheet" href="style.css?v=20261107-part-times"><script type="module" src="admin.js?v=20261107-letterspacing"></script></head><body><header class="site-header"><a class="wordmark" href="https://grazie.club.nitech.ac.jp/" aria-label="Grazie!! 公式サイト"><img src="assets/grazie-logo.png" alt="Grazie!!" width="88" height="32" style="display:block;width:88px;height:32px;max-width:88px;object-fit:contain;flex-shrink:0"></a><span>進行管理</span><a href="./" target="_blank" rel="noopener noreferrer">公開画面 ↗</a></header><main class="page admin-page"><div class="eyebrow">STAGE CONTROL</div><h1>ライブの進行</h1><p class="muted">出演が始まったら、バンドを選んで切り替えてください。時刻は自動で記録されます。</p><p id="admin-message" class="notice" role="status">接続を確認しています。</p><section class="live-panel"><span class="live-label">現在の進行</span><h2 id="admin-current">確認中</h2><p id="admin-updated" class="small"></p></section><fieldset id="controls" disabled><label class="search-label" for="control-day">公演日</label><select id="control-day"></select><label class="search-label" for="control-slot">切り替え先</label><select id="control-slot"></select><label class="search-label" for="control-note">備考(任意)</label><input id="control-note" maxlength="500" placeholder="例: 操作訂正、順番変更"><button type="button" id="next" class="primary-button">次の枠へ進む</button><button type="button" id="switch" class="secondary-button">選択したバンド・進行に切り替える</button></fieldset><section class="history-section"><div class="section-heading"><h2>進行履歴</h2><button id="csv" class="secondary-button" disabled>CSVを保存</button></div><p class="muted small">履歴は追記で保存されます。操作を訂正する場合も、再度切り替えて備考に残してください。</p><ol id="history"></ol></section></main><footer id="site-footer" class="site-footer"></footer><dialog id="confirm"><form method="dialog"><h2>進行を切り替えますか？</h2><p id="confirm-target"></p><p class="muted small">観客の画面に反映され、切り替え時刻が記録されます。</p><div class="dialog-actions"><button value="cancel" class="secondary-button">戻る</button><button value="switch" class="primary-button">切り替える</button></div></form></dialog></body></html>
